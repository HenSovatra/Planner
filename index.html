:root{
  --bg:#f6eef0;--surface:#fffafb;--ink:#2b1a2e;--muted:#7b6a80;--line:#e6d6dc;
  --accent:#b8325f;--accent-ink:#fff;--soft:#f3dde5;--ok:#2f7d5b;
  --font:"Krasar",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1220;--surface:#271a2c;--ink:#f6e9ee;--muted:#b7a3bd;--line:#40304a;--accent:#e05a88;--accent-ink:#1c1220;--soft:#3a2540;--ok:#6fcf9f}}
:root[data-theme="dark"]{--bg:#1c1220;--surface:#271a2c;--ink:#f6e9ee;--muted:#b7a3bd;--line:#40304a;--accent:#e05a88;--accent-ink:#1c1220;--soft:#3a2540;--ok:#6fcf9f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
button,input{font-family:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font)}
main{max-width:620px;margin:0 auto;padding:40px 20px 56px}
h1{font:700 clamp(2rem,8vw,3rem)/1.05 var(--font);margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 32px}
.phase{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px}
.phase h2{font:700 1.3rem/1.2 var(--font);margin:0}
.time{color:var(--accent);font-weight:600;margin:2px 0 12px}
.ride{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;padding:10px 0 10px 22px;border-left:2px dashed var(--line);margin-left:26px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-weight:500;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.other{border-style:dashed;color:var(--muted)}
.opt.other[aria-pressed="true"]{color:var(--accent-ink)}
.alts{margin-top:12px;padding:12px;background:var(--soft);border-radius:12px;display:none}
.alts.open{display:block}
.alts p{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.alts input{width:100%;margin-top:10px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}

.tip{position:fixed;z-index:50;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px rgba(40,10,30,.25);pointer-events:none;opacity:0;transition:opacity .12s}
.tip.show{opacity:1;pointer-events:auto}
.tip .img {
  height: auto;
  min-height: 130px;
  max-height: 280px;
  background: linear-gradient(135deg, var(--soft), var(--line));
  display: grid;
  place-items: center;
  font-size: 2.6rem;
  overflow: hidden;
}

.tip .img img {
  width: 100%;
  height: auto;
  max-height: 280px;
  object-fit: contain;
  display: block;
}
.tip .body{padding:12px 14px 14px}
.tip h3{font:700 1.05rem/1.2 var(--font);margin:0 0 4px}
.tip p{margin:0 0 6px;font-size:.88rem;color:var(--muted)}
.tip .loc{color:var(--ink)}
.tip a{color:var(--accent);font-weight:600;font-size:.9rem}
.alts .own{display:block;margin-top:10px;font-size:.85rem;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{display:block;width:100%;margin-top:32px;font:700 1.15rem var(--font);color:var(--accent-ink);background:var(--accent);border:0;border-radius:16px;padding:16px;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
#status{margin-top:16px;text-align:center;min-height:1.5em}
#status.ok{color:var(--ok);font-weight:600}
#status.err{color:var(--accent)}
#status a{color:var(--accent);font-weight:600}
</style>
</head>

      {name:"Loot / ការនាំយកត្រឡបើមកវិញនូវរតនសម្បត្តិវត្ថុកម្ពុជា", desc:"", location:"Theatre: Legend Cinemas, Eden Garden", emoji:"💕", startTime:"12:40 PM", duration:"1 hour 25 minutes",image:"loot.jpg"},
      {name:"Where Is My Head 2 / ឃើញក្បាលខ្ញុំទេ ២", desc:"", location:"Theatre: Prime Cineplex Samai Square", emoji:"🍿", startTime:"11:30 AM", duration:"1 hour 50 minutes",image:"whereismyhead2.png"},
    ],
    ride:"Around 15 mins ride" },
  { title:"Dinner", time:"2:20 PM – 4 PM", emoji:"🍲", custom:true,
    options:[{name:"Lao Ma Hot Pot", desc:"", location:"", image:"laoma.jpg"}],
    others:[
      {name:"Xiao Ge Hot Pot - Toul Kork", desc:"New Drinkkk", location:"", emoji:"🥩",image:"xiaoge.jpg"},
      {name:"Seoul Spicy Noodle", desc:"", location:"", emoji:"🍕",image:"spicynoodle.jpg"},
      {name:"មីល្ពៅ", desc:"", location:"", emoji:"🍚",image:"miilpov.webp"},
    ],
    ride:null }
];
/* =================================== */

const norm = o => typeof o === "string" ? {name:o} : o;
const state = PLAN.map(p => ({choice:norm(p.options[0]).name, other:false, isCustom:false, customText:""}));
const root = document.getElementById("plan");
const tip = document.getElementById("tip");
let hideT;

function details(i, name){
  const p = PLAN[i];
  return [...p.options, ...p.others].map(norm).find(o => o.name === name) || {name};
}
function showTip(el, i, name){  
  clearTimeout(hideT);
  const d = details(i, name), p = PLAN[i];
  const q = encodeURIComponent((d.location && !/add /i.test(d.location) ? d.location.replace(/^Theatre:\s*/i,"") + " " : d.name + " ") + CITY);
  tip.innerHTML = `<div class="img"></div><div class="body"><h3></h3></div>`;
  const img = tip.querySelector(".img");
  if(d.image){
    const im = new Image(); im.alt = d.name; im.onload = () => {img.textContent=""; img.append(im);};
    im.src = d.image; img.textContent = d.emoji || p.emoji;
  } else img.textContent = d.emoji || p.emoji;
  const body = tip.querySelector(".body");
  body.querySelector("h3").textContent = d.name;
  if(d.desc){ const e=document.createElement("p"); e.textContent=d.desc; body.append(e); }
  if(d.startTime){ const e=document.createElement("p"); e.textContent="🕒 Starts at: "+d.startTime; body.append(e); }
  if(d.duration){ const e=document.createElement("p"); e.textContent="⏱️ Duration: "+d.duration; body.append(e); }
  if(d.location){ const e=document.createElement("p"); e.className="loc"; e.textContent="📍 "+d.location; body.append(e); }
  const a = document.createElement("a");
  a.href = "https://www.google.com/maps/search/?api=1&query=" + q; a.target="_blank"; a.rel="noopener";
  a.textContent = "Open in Maps"; body.append(a);
  tip.classList.add("show");
  const r = el.getBoundingClientRect(), w = 260, h = tip.offsetHeight;
  let x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
  let y = r.top - h - 8; if(y < 8) y = r.bottom + 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip(){ hideT = setTimeout(() => tip.classList.remove("show"), 120); }
tip.onmouseenter = () => clearTimeout(hideT);
tip.onmouseleave = hideTip;
document.addEventListener("click", (e) => {
  if (
    !tip.contains(e.target) &&
    !e.target.closest(".opt")
  ) {
    clearTimeout(hideT);
    tip.classList.remove("show");
  }
});
function render(){
  root.innerHTML = "";
  PLAN.forEach((p,i) => {
    const s = state[i];
    const card = document.createElement("section");
    card.className = "phase";
    card.innerHTML = `<h2></h2><div class="time"></div><div class="opts"></div><div class="alts"></div>`;
    card.querySelector("h2").textContent = p.title;
    card.querySelector(".time").textContent = p.time;
    if(p.fixed){
      card.querySelector(".opts").remove(); card.querySelector(".alts").remove();
      card.querySelector(".time").style.marginBottom = "0";
      root.append(card);
      if(p.ride){ const r = document.createElement("div"); r.className = "ride"; r.textContent = "🛵 " + p.ride; root.append(r); }
      return;
    }
    const opts = card.querySelector(".opts");
    p.options.map(norm).forEach(o => opts.append(btn(i, o.name, !s.other && s.choice===o.name, () => {s.choice=o.name; s.other=false; s.isCustom=false; render();})));
    const ob = document.createElement("button");
    ob.type="button"; ob.className="opt other"; ob.textContent="Other"; ob.setAttribute("aria-pressed", s.other);
    ob.onclick = () => {s.other=true; if(!s.isCustom && !p.others.map(norm).some(o=>o.name===s.choice)) s.choice=norm(p.others[0]).name; render();};
    opts.append(ob);
    const alts = card.querySelector(".alts");
    if(s.other){
      alts.classList.add("open");
      alts.innerHTML = `<p>Pick another plan</p><div class="opts"></div>`;
      const box = alts.querySelector(".opts");
      p.others.map(norm).forEach(o => box.append(btn(i, o.name, !s.isCustom && s.choice===o.name, () => {s.choice=o.name; s.isCustom=false; s.customText=""; render();})));
      if(p.custom){
        const lab = document.createElement("label");
        lab.className = "own"; lab.textContent = "Or write your own";
        const inp = document.createElement("input");
        inp.type="text"; inp.maxLength=120; inp.placeholder = p.title==="Dinner" ? "e.g. Sushi near the riverside" : "e.g. A cozy café I found";
        inp.value = s.customText;
        inp.oninput = () => {
          s.customText = inp.value; const v = inp.value.trim();
          if(v){ s.choice = v; s.isCustom = true; }
          else { s.isCustom = false; s.choice = norm(p.others[0]).name; }
          box.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", !s.isCustom && b.textContent===s.choice));
        };
        lab.append(inp); alts.append(lab);
      }
    }
    root.append(card);
    if(p.ride){
      const r = document.createElement("div");
      r.className = "ride";
      r.textContent = "🛵 " + p.ride;
      root.append(r);
    }
  });
}
function btn(i, label, pressed, fn) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "opt";
  b.textContent = label;
  b.setAttribute("aria-pressed", pressed);

  b.onclick = () => {
    fn();

    // Find the selected button after the UI rerenders
    const buttons = [...root.querySelectorAll(".opt")];
    const selected = buttons.find(
      x => x.textContent === label &&
           x.getAttribute("aria-pressed") === "true"
    );

    if (selected) {
      showTip(selected, i, label);
    }
  };

  // Desktop: show tooltip on hover
  b.onmouseenter = () => showTip(b, i, label);
  b.onfocus = () => showTip(b, i, label);
  b.onmouseleave = hideTip;
  b.onblur = hideTip;

  return b;
}
function buildMessage(){
  const lines = PLAN.map((p,i) => {
    const d = details(i, state[i].choice);
    const loc = d.location && !/add /i.test(d.location) ? " (" + d.location + ")" : "";
    const movieTime = d.startTime ? `\n   Start: ${d.startTime}` : "";
    const duration = d.duration ? `\n   Duration: ${d.duration}` : "";
    return `${p.time} · ${p.title}: ${state[i].choice}${movieTime}${duration}${loc}`;
  });
  return "💌 Our date plan is set!\n\n" + lines.join("\n");
}

const go = document.getElementById("go"), status = document.getElementById("status");
function setStatus(cls, html){ status.className = cls; status.innerHTML = html; }

go.onclick = async () => {
  const text = buildMessage();
  const shareUrl = "https://t.me/share/url?url=%20&text=" + encodeURIComponent(text);
  go.disabled = true; setStatus("", "Sending…");
  try{
    if(!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) throw new Error("not configured");
    const res = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({chat_id:TELEGRAM_CHAT_ID, text})
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.description || "Telegram error");
    setStatus("ok", "Sent! See you soon 💕");
  }catch(e){
    setStatus("err", `Couldn’t send automatically (${e.message}). <a href="${shareUrl}" target="_blank" rel="noopener">Send it through Telegram instead</a>`);
  }
  go.disabled = false;
};

render();
</script>
</body>
